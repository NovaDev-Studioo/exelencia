{% extends 'admin/base.html' %}
{% block h1 %}Categorías{% endblock %}
{% block body %}
<form method="post" class="form-card inline-f">
  <input type="hidden" name="_csrf" value="{{ csrf() }}">
  <label>Nombre<input name="name" required></label>
  <label>Ícono<select name="icon">{% for k, n in cat_icons %}<option value="{{ k }}">{{ n }}</option>{% endfor %}</select></label>
  <button class="btn">Agregar</button>
</form>
<table class="tbl">
  <tr><th>Ícono</th><th>Nombre</th><th>Productos</th><th></th></tr>
  {% for c in rows %}<tr><td>{{ icon(c.icon, 22) }}</td><td>{{ c.name }}</td><td>{{ c.n }}</td>
    <td><form method="post" action="{{ url_for('admin.category_del', cid=c.id) }}" onsubmit="return confirm('¿Borrar categoría? Sus productos quedan sin categoría.')"><input type="hidden" name="_csrf" value="{{ csrf() }}"><button class="btn btn-sm btn-danger">Borrar</button></form></td></tr>{% endfor %}
</table>
{% endblock %}
