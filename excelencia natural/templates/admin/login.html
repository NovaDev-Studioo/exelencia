<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso personal · Excelencia Natural</title>
<link rel="icon" href="{{ url_for('static', filename='img/Logo.png') }}">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body class="adm-login">
<form method="post" class="form-card auth">
  <img class="logo-top" src="{{ url_for('static', filename='img/Logo.png') }}" alt="">
  <h1 class="center">Acceso del personal</h1>
  {% for c, m in get_flashed_messages(with_categories=true) %}<div class="toast {{ c }} static">{{ m }}</div>{% endfor %}
  <input type="hidden" name="_csrf" value="{{ csrf() }}">
  <label>Correo<input type="email" name="email" required autofocus></label>
  <label>Contraseña<input type="password" name="password" required></label>
  <button class="btn btn-lg block">Entrar</button>
  <p class="muted center small"><a href="{{ url_for('shop.index') }}">Volver a la tienda</a></p>
</form></body></html>
